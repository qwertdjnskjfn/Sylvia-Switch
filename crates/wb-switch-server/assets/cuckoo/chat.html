<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sylvia Switch · Cuckoo Chat</title>
<style>
  :root { --bg:#0f1117; --panel:#161a23; --border:#2a2f3d; --text:#e6e9f0; --dim:#8b93a7; --accent:#4f8cff; --user-bg:#1f2937; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); flex:none; }
  header .logo { font-weight:600; font-size:14px; }
  header .badge { font-size:11px; color:var(--dim); border:1px solid var(--border); border-radius:10px; padding:1px 8px; }
  select, button.ctl { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:12px; }
  #sylvia-status { margin-left:auto; font-size:11px; color:var(--dim); }
  #sylvia-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--user-bg); border:1px solid var(--border); }
  .msg.assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--border); }
  .msg.assistant.streaming { border-color:var(--accent); }
  .msg.error { align-self:flex-start; background:#2a1518; border:1px solid #7a2a33; color:#f0b6bd; }
  #sylvia-composer { flex:none; display:flex; gap:10px; padding:12px 16px; background:var(--panel); border-top:1px solid var(--border); }
  #sylvia-input { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:13px; font-family:inherit; resize:none; height:64px; }
  #sylvia-input:focus { outline:none; border-color:var(--accent); }
  #sylvia-send { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0 22px; font-size:13px; cursor:pointer; }
  #sylvia-send:disabled { opacity:.45; cursor:not-allowed; }
  .hint { text-align:center; color:var(--dim); font-size:11px; padding:6px; }
</style>
</head>
<body>
<header>
  <span class="logo">Sylvia Switch</span>
  <span class="badge">Cuckoo Provider</span>
  <select id="sylvia-model"></select>
  <button class="ctl" id="sylvia-clear" type="button">清空会话</button>
  <span id="sylvia-status"></span>
</header>
<div id="sylvia-messages"></div>
<div id="sylvia-composer">
  <textarea id="sylvia-input" placeholder="输入消息…（Ctrl+Enter 发送）"></textarea>
  <button id="sylvia-send" type="button" disabled>发送</button>
</div>
<div class="hint">本页面供 Cuckoo Code 自定义 Provider 内嵌使用，也可直接人工对话。回复经本机网关转发，无需 API Key。</div>
<script>
(function () {
  var LS_KEY = 'sylvia-cuckoo-chat-v1';
  var messagesEl = document.getElementById('sylvia-messages');
  var inputEl = document.getElementById('sylvia-input');
  var sendEl = document.getElementById('sylvia-send');
  var modelEl = document.getElementById('sylvia-model');
  var statusEl = document.getElementById('sylvia-status');
  var history = [];
  var busy = false;

  try { history = JSON.parse(localStorage.getItem(LS_KEY) || '[]') || []; } catch (e) { history = []; }

  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(history.slice(-100))); } catch (e) {} }

  function addBubble(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function renderHistory() {
    messagesEl.innerHTML = '';
    history.forEach(function (m) { addBubble(m.role === 'assistant' ? 'assistant' : 'user', m.content); });
  }

  function setStatus(s) { statusEl.textContent = s || ''; }

  // ---- 模型列表 ----
  fetch('/cuckoo/api/models').then(function (r) { return r.json(); }).then(function (j) {
    var ids = [];
    if (j && j.data && j.data.forEach) {
      j.data.forEach(function (m) { if (m && m.id) ids.push(m.id); });
    }
    if (!ids.length) ids = ['glm-5.3-flash'];
    var urlModel = new URLSearchParams(location.search).get('model');
    ids.forEach(function (id) {
      var opt = document.createElement('option');
      opt.value = id; opt.textContent = id;
      modelEl.appendChild(opt);
    });
    if (urlModel && ids.indexOf(urlModel) !== -1) modelEl.value = urlModel;
    else if (ids.indexOf('glm-5.3-flash') !== -1) modelEl.value = 'glm-5.3-flash';
  }).catch(function () {
    var opt = document.createElement('option');
    opt.value = 'glm-5.3-flash'; opt.textContent = 'glm-5.3-flash';
    modelEl.appendChild(opt);
  });

  // ---- 发送 ----
  function setBusy(v) {
    busy = v;
    sendEl.disabled = v || !inputEl.value.trim();
  }

  function dispatchCuckooResponse(text) {
    try {
      window.dispatchEvent(new CustomEvent('cuckoo-ai-response', {
        detail: { text: text, finished: true }
      }));
    } catch (e) {}
  }

  async function send() {
    var text = inputEl.value.trim();
    if (!text || busy) return;
    inputEl.value = '';
    setBusy(false);
    history.push({ role: 'user', content: text });
    addBubble('user', text);
    save();

    setBusy(true);
    setStatus('生成中…');
    var bubble = addBubble('assistant', '');
    bubble.classList.add('streaming');
    var full = '';

    try {
      var resp = await fetch('/cuckoo/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelEl.value || 'glm-5.3-flash',
          messages: history,
          stream: true
        })
      });
      if (!resp.ok || !resp.body) {
        var errText = await resp.text().catch(function () { return ''; });
        throw new Error('HTTP ' + resp.status + ' ' + errText.slice(0, 300));
      }
      var reader = resp.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buf = '';
      while (true) {
        var rd = await reader.read();
        if (rd.done) break;
        buf += decoder.decode(rd.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n')) !== -1) {
          var line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line || line.indexOf('data:') !== 0) continue;
          var payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            var j = JSON.parse(payload);
            var delta = j.choices && j.choices[0] && (j.choices[0].delta || j.choices[0].message) || {};
            var piece = (typeof delta.content === 'string') ? delta.content : '';
            if (piece) {
              full += piece;
              bubble.textContent = full;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch (e) {}
        }
      }
      if (!full) throw new Error('上游未返回任何内容');
      bubble.classList.remove('streaming');
      history.push({ role: 'assistant', content: full });
      save();
      setStatus('');
      // 通知 Cuckoo Code（拦截模式）：完整回复已就绪
      dispatchCuckooResponse(full);
    } catch (e) {
      bubble.classList.remove('streaming');
      bubble.className = 'msg error';
      bubble.textContent = '❌ ' + (e && e.message ? e.message : String(e));
      setStatus('出错');
      // 失败时从历史移除这条 user 消息，允许重试
      if (history.length && history[history.length - 1].role === 'user') history.pop();
      save();
    } finally {
      setBusy(false);
    }
  }

  sendEl.addEventListener('click', send);
  inputEl.addEventListener('input', function () { sendEl.disabled = busy || !inputEl.value.trim(); });
  inputEl.addEventListener('keydown', function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); send(); }
  });
  document.getElementById('sylvia-clear').addEventListener('click', function () {
    history = [];
    save();
    renderHistory();
  });

  renderHistory();
})();
</script>
</body>
</html>
