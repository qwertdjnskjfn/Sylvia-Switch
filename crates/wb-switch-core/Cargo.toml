[package]
name = "wb-switch-core"
version = "2.0.2"
edition = "2021"
description = "wb-switch 核心逻辑（账号/切换/会话/签到/更新），不依赖 Tauri，可被桌面端与 HTTP server 复用"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

# VS Code 系客户端 Safe Storage（state.vscdb secret inject）：
# WorkBuddy 桌面端与 Qoder 等 Electron 客户端共用同一套 Windows GCM 解密
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"

# 平台签到（AutoClaw / TRAE Work CN）凭证解密
sha2 = "0.10"
md-5 = "0.10"

# TRAE 登录态自动续期（/trae/api/v3/oauth/ExchangeToken 的 DeviceProof 签名）
p256 = { version = "0.13", features = ["ecdsa", "pem"] }

# GLM 代理（AutoClaw → OpenAI 兼容接口）流式转发
memchr = "2"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Grok SSO 同步（CDP WebSocket 抓 cookie）
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-io = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "UI_Notifications", "Data_Xml_Dom", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }
winreg = "0.52"

